# ===================================================================
# Datasource - MySQL (rodando via DevServices com Testcontainers)
# ===================================================================
quarkus.datasource.db-kind=mysql
quarkus.hibernate-orm.database.generation=update
quarkus.hibernate-orm.log.sql=true

# DevServices para MySQL
quarkus.datasource.devservices.enabled=true
quarkus.datasource.devservices.image-name=mysql:8.0
quarkus.datasource.devservices.database-name=meu_banco
quarkus.datasource.devservices.username=quarkus
quarkus.datasource.devservices.password=quarkus
quarkus.datasource.devservices.container-name=meu-mysql-dev

# ===================================================================
# Keycloak - DevServices (para autenticação e autorização)
# ===================================================================

# Ativa DevServices do Keycloak
quarkus.keycloak.devservices.enabled=true

# Força uma versão estável (compatível com Quarkus 3.26.2 e JDK 21)
quarkus.keycloak.devservices.image-name=quay.io/keycloak/keycloak:24.0.5

# Realm que será criado automaticamente (padrão: quarkus)
quarkus.keycloak.devservices.realm-name=quarkus

# Habilita a console de administração do Keycloak
quarkus.keycloak.devservices.create-admin-user=true
quarkus.keycloak.devservices.admin-username=admin
quarkus.keycloak.devservices.admin-password=admin

# ===================================================================
# Configuração OIDC para proteger endpoints da sua aplicação
# ===================================================================
quarkus.oidc.auth-server-url=http://localhost:8180/realms/quarkus
quarkus.oidc.client-id=backend-service
quarkus.oidc.credentials.secret=secret
quarkus.oidc.application-type=service
